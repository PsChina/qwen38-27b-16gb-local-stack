# DeepSeek Harness (DSH / pi-ai) settings for the local Qwen 3.8 stack.
# This is the annotated equivalent of qwen38.provider.example.json.
# Copy/merge this document into ~/.dsh/settings.yaml.

llm-pi-ai:
  providers:
    qwen38:
      apiKeyEnv: QWEN38_API_KEY        # env var name; do not put a secret here
      displayName: Qwen3.8-27B Local
      api: openai-completions
      baseURL: http://qwen-host.example:8098/v1 # replace host privately; no /chat/completions

      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        supportsReasoningEffort: true
        thinkingFormat: openai
        supportsStrictMode: false

      reasoning: xhigh                  # provider default effort (official Qwen3.8 default)
      transport: sse
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      requestImagePixelBudget: 16777216
      requestImageMaxBytes: 8388608

      models:
        - id: Qwen3.8-27B-Q3             # must match llama-server --alias
          name: Qwen3.8 27B Q3
          contextWindow: 82000
          maxTokens: 9216
          input: [text, image]
          reasoningEfforts:                 # Qwen-native thinking levels: low, medium, xhigh; Harness adds off
            "off": none                     # Harness off control disables thinking
            low: low
            medium: medium
            xhigh: xhigh                    # default effort for this profile
          sampling:
            thinking:
              temperature: 1.0
              top_p: 0.95
              top_k: 20
              min_p: 0
              presence_penalty: 0
              repeat_penalty: 1
            off:
              temperature: 0.7
              top_p: 0.8
              top_k: 20
              min_p: 0
              presence_penalty: 1.5
              repeat_penalty: 1

        - id: Qwen3.8-27B-Q2
          name: Qwen3.8 27B Q2
          contextWindow: 100000
          maxTokens: 16384
          input: [text, image]
          reasoningEfforts:                 # Qwen-native thinking levels: low, medium, xhigh; Harness adds off
            "off": none                     # Harness off control disables thinking
            low: low
            medium: medium
            xhigh: xhigh                    # default effort for this profile
          sampling:
            thinking:
              temperature: 1.0
              top_p: 0.95
              top_k: 20
              min_p: 0
              presence_penalty: 0
              repeat_penalty: 1
            off:
              temperature: 0.7
              top_p: 0.8
              top_k: 20
              min_p: 0
              presence_penalty: 1.5
              repeat_penalty: 1

agent-default-model:
  provider: qwen38
  model: Qwen3.8-27B-Q3
  reasoningEffort: xhigh
